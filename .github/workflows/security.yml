name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: '1.33.1'
          advanced-security: false
          online-audits: false
          min-severity: medium

  scan:
    name: Secrets and Docker dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install verified scanner
        working-directory: ${{ runner.temp }}
        run: |
          archive=trivy_0.76.2_Linux-64bit.tar.gz
          curl --fail --silent --show-error --location --proto '=https' \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/$archive" -o "$archive"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $archive" | sha256sum --check
          tar -xzf "$archive" trivy
      - name: Check for exposed credentials
        run: '"$RUNNER_TEMP/trivy" fs --scanners secret --skip-dirs .git --exit-code 1 .'
      - name: Scan evaluator image dependencies
        shell: bash
        run: |
          versions=$(npm view --registry=https://registry.npmjs.org @opencode/cli versions --json | node eval/resolve-opencode-versions.mjs)
          status=0
          while IFS= read -r version; do
            image="router-security:$version"
            if docker build --pull --build-arg "OPENCODE_IMAGE=ghcr.io/anomalyco/opencode:$version" -t "$image" ./eval; then
              "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln --severity HIGH,CRITICAL \
                --exit-code 1 "$image" || status=1
            else
              status=1
            fi
          done <<< "$versions"
          exit "$status"
