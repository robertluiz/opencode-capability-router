name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test eval/router-compaction.test.mjs indexer-model-test.mjs storage-test.mjs installer-test.mjs

  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        opencode: ['2.2.0', '2.3.2', '2.4.1']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build evaluator
        run: docker build --build-arg OPENCODE_IMAGE=ghcr.io/anomalyco/opencode:${{ matrix.opencode }} -t router-eval ./eval
      - name: Compaction
        run: docker run --rm --network none --mount "type=bind,source=$PWD,target=/router,readonly" router-eval
      - name: Indexer (installed)
        run: docker run --rm --network none --mount "type=bind,source=$PWD,target=/router,readonly" router-eval /eval/indexer-model.mjs installed
      - name: Indexer (explicit)
        run: docker run --rm --network none --mount "type=bind,source=$PWD,target=/router,readonly" router-eval /eval/indexer-model.mjs
